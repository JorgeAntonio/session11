name: CI

# Se ejecuta en cada push a main y en cada Pull Request hacia main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Si subes otro commit al mismo PR, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Variables públicas de ejemplo. Los secretos reales van en
      # Settings → Secrets and variables → Actions, nunca en este archivo.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      # NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (exactas, desde package-lock)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Tests unitarios (Vitest)
        run: npm run test

      - name: Build de producción
        run: npm run build

      - name: Instalar navegador para E2E
        run: npx playwright install --with-deps chromium

      - name: Tests E2E (Playwright)
        run: npm run test:e2e

      - name: Guardar reporte de Playwright si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
